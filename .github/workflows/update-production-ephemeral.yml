name: Ephemeral Scheduled Production Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: read

concurrency:
  group: scheduled-ephemeral-production
  cancel-in-progress: false

jobs:
  update-production:
    name: Fetch, validate, stage, promote, and verify Production
    runs-on: ubuntu-latest
    timeout-minutes: 105

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify required repository secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in FRED_API_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: npm ci

      - name: Remove checked-in production snapshots
        run: |
          rm -rf data/series data/derived
          rm -f data/latest-spot.json data/latest-cn-etf.json data/manifest.json
          mkdir -p data/series data/derived

      - name: Verify empty production-data baseline
        run: |
          if find data/series data/derived -type f -print -quit | grep -q .; then
            echo "::error::Production series or derived snapshots remain before fetch."
            exit 1
          fi
          for file in data/latest-spot.json data/latest-cn-etf.json data/manifest.json; do
            if [ -e "$file" ]; then
              echo "::error::Production file remains before fetch: $file"
              exit 1
            fi
          done

      - name: Fetch all production data
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:fetch

      - name: Verify complete ephemeral dataset
        id: dataset
        run: node scripts/validate-ephemeral-build.mjs data

      - name: Run data quality gate
        id: quality
        run: npm run data:check

      - name: Remove raw and probe staging before build
        run: rm -rf data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out

      - name: Verify raw and probe staging is absent
        id: staging
        run: |
          for path in data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out; do
            if [ -e "$path" ]; then
              echo "::error::Staging path remains before build: $path"
              exit 1
            fi
          done
          echo "status=clean" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        run: npm test

      - name: Run typecheck
        id: typecheck
        run: npm run typecheck

      - name: Pull Vercel Production project settings
        id: vercel-pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production output
        id: vercel-build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 build --prod --token="$VERCEL_TOKEN"

      - name: Verify Next.js build tracing
        id: tracing
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs trace

      - name: Verify Vercel prebuilt output
        id: output
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs vercel-output

      - name: Record current formal Production
        id: previous
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";

          const productionHost = "gold-market-observatory.vercel.app";
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${productionHost}`);
          if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          if (!response.ok) throw new Error("Unable to record the current formal Production deployment");

          const deployment = await response.json();
          if (
            deployment.projectId !== process.env.VERCEL_PROJECT_ID
            || deployment.target !== "production"
            || deployment.readyState !== "READY"
            || !deployment.id
            || !deployment.url
          ) {
            throw new Error("The current formal Production deployment cannot be recorded safely");
          }

          const immutableUrl = deployment.url.startsWith("https://") ? deployment.url : `https://${deployment.url}`;
          await appendFile(process.env.GITHUB_OUTPUT, [
            `id=${deployment.id}`,
            `url=${immutableUrl}`,
            "status=recorded",
            "",
          ].join("\n"), "utf8");
          console.log("Current formal Production deployment recorded.");
          NODE

      - name: Deploy staged Production without domain assignment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          staged_url="$(npx --yes vercel@59.1.4 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          case "$staged_url" in
            https://*.vercel.app) ;;
            *)
              echo "::error::Vercel CLI did not return a valid staged Production deployment URL."
              exit 1
              ;;
          esac
          if [ "$staged_url" = "https://gold-market-observatory.vercel.app" ]; then
            echo "::error::Staged deployment resolved to the formal Production domain; refusing to continue."
            exit 1
          fi
          echo "url=$staged_url" >> "$GITHUB_OUTPUT"
          echo "Staged Production deployment created without formal domain assignment."

      - name: Verify staged classification and domain safety
        id: classification
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS_PRODUCTION_ID: ${{ steps.previous.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";

          const productionHost = "gold-market-observatory.vercel.app";
          async function getDeployment(host) {
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${host}`);
            if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!response.ok) throw new Error(`Unable to inspect deployment metadata for ${host}`);
            return response.json();
          }

          const stagedHost = new URL(process.env.STAGED_URL).hostname;
          const staged = await getDeployment(stagedHost);
          const current = await getDeployment(productionHost);
          const aliases = Array.isArray(staged.alias) ? staged.alias : [];
          const automaticAliases = Array.isArray(staged.automaticAliases) ? staged.automaticAliases : [];

          if (
            staged.projectId !== process.env.VERCEL_PROJECT_ID
            || staged.target !== "production"
            || staged.readyState !== "READY"
            || !staged.id
          ) {
            throw new Error("The staged deployment is not a ready Production deployment for the configured project");
          }
          if (staged.id === process.env.PREVIOUS_PRODUCTION_ID) {
            throw new Error("The staged deployment is not distinct from the previous Production deployment");
          }
          if (aliases.includes(productionHost) || automaticAliases.includes(productionHost)) {
            throw new Error("The staged deployment has received the formal Production domain");
          }
          if (
            current.id !== process.env.PREVIOUS_PRODUCTION_ID
            || current.projectId !== process.env.VERCEL_PROJECT_ID
            || current.target !== "production"
            || current.readyState !== "READY"
          ) {
            throw new Error("The formal Production domain changed or became unsafe during staged deployment");
          }

          await appendFile(process.env.GITHUB_OUTPUT, [
            `staged_id=${staged.id}`,
            "status=production-staged",
            "domain_status=unchanged",
            "",
          ].join("\n"), "utf8");
          console.log("Staged classification and formal-domain safety verified.");
          NODE

      - name: Smoke test staged Production routes
        id: staged-smoke
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          smoke_route() {
            route="$1"
            response_file="$(mktemp)"
            if ! npx --yes vercel@59.1.4 curl "$route" \
              --deployment "$STAGED_URL" \
              --silent --show-error --fail --location \
              --output "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            if ! grep -Eq "Gold Market Observatory|黄金市场观察站" "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            rm -f "$response_file"
          }

          if ! smoke_route /; then
            echo "::error::Staged Production smoke test failed: /"
            exit 1
          fi
          echo "root_status=success" >> "$GITHUB_OUTPUT"
          echo "Staged Production smoke test passed: /"

          if ! smoke_route /design/refined-v4; then
            echo "::error::Staged Production smoke test failed: /design/refined-v4"
            exit 1
          fi
          echo "refined_status=success" >> "$GITHUB_OUTPUT"
          echo "Staged Production smoke test passed: /design/refined-v4"

      - name: Run final pre-promotion safety check
        id: preflight
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          STAGED_ID: ${{ steps.classification.outputs.staged_id }}
          PREVIOUS_PRODUCTION_ID: ${{ steps.previous.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";

          const productionHost = "gold-market-observatory.vercel.app";
          async function getDeployment(host) {
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${host}`);
            if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!response.ok) throw new Error(`Unable to inspect deployment metadata for ${host}`);
            return response.json();
          }

          const stagedHost = new URL(process.env.STAGED_URL).hostname;
          const current = await getDeployment(productionHost);
          const staged = await getDeployment(stagedHost);
          const aliases = Array.isArray(staged.alias) ? staged.alias : [];
          const automaticAliases = Array.isArray(staged.automaticAliases) ? staged.automaticAliases : [];

          if (
            current.id !== process.env.PREVIOUS_PRODUCTION_ID
            || current.projectId !== process.env.VERCEL_PROJECT_ID
            || current.target !== "production"
            || current.readyState !== "READY"
          ) {
            throw new Error("The formal Production deployment changed before promotion");
          }
          if (
            staged.id !== process.env.STAGED_ID
            || staged.projectId !== process.env.VERCEL_PROJECT_ID
            || staged.target !== "production"
            || staged.readyState !== "READY"
          ) {
            throw new Error("The staged Production deployment changed or is no longer ready");
          }
          if (aliases.includes(productionHost) || automaticAliases.includes(productionHost)) {
            throw new Error("The staged deployment owns the formal Production domain before promotion");
          }

          await appendFile(process.env.GITHUB_OUTPUT, "status=valid\n", "utf8");
          console.log("Final pre-promotion safety check passed.");
          NODE

      - name: Promote validated staged Production
        id: promotion
        continue-on-error: true
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx --yes vercel@59.1.4 promote "$STAGED_URL" --yes --timeout=3m --token="$VERCEL_TOKEN"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Verify formal domain switched to staged deployment
        id: switch
        if: steps.promotion.outcome == 'success'
        continue-on-error: true
        env:
          STAGED_ID: ${{ steps.classification.outputs.staged_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";

          const productionHost = "gold-market-observatory.vercel.app";
          async function getCurrentProduction() {
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${productionHost}`);
            if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!response.ok) throw new Error("Unable to resolve the formal Production domain after promotion");
            return response.json();
          }

          let current;
          for (let attempt = 1; attempt <= 6; attempt++) {
            current = await getCurrentProduction();
            if (current.id === process.env.STAGED_ID) break;
            if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (
            current?.id !== process.env.STAGED_ID
            || current.projectId !== process.env.VERCEL_PROJECT_ID
            || current.target !== "production"
          ) {
            throw new Error("The formal Production domain does not resolve to the staged deployment");
          }

          await appendFile(process.env.GITHUB_OUTPUT, `status=switched\nfinal_id=${current.id}\n`, "utf8");
          console.log("Formal Production domain now resolves to the staged deployment.");
          NODE

      - name: Smoke test formal Production routes
        id: production-smoke
        if: steps.switch.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_URL: https://gold-market-observatory.vercel.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          smoke_route() {
            route="$1"
            response_file="$(mktemp)"
            if ! npx --yes vercel@59.1.4 curl "$route" \
              --deployment "$PRODUCTION_URL" \
              --silent --show-error --fail --location \
              --output "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            if ! grep -Eq "Gold Market Observatory|黄金市场观察站" "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            rm -f "$response_file"
          }

          if ! smoke_route /; then
            echo "::error::Formal Production smoke test failed: /"
            exit 1
          fi
          echo "root_status=success" >> "$GITHUB_OUTPUT"
          echo "Production smoke test passed: /"

          if ! smoke_route /design/refined-v4; then
            echo "::error::Formal Production smoke test failed: /design/refined-v4"
            exit 1
          fi
          echo "refined_status=success" >> "$GITHUB_OUTPUT"
          echo "Production smoke test passed: /design/refined-v4"

      - name: Determine whether rollback is required
        id: rollback-required
        if: always() && steps.preflight.outcome == 'success' && steps.promotion.outputs.attempted == 'true'
        env:
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          SWITCH_OUTCOME: ${{ steps.switch.outcome }}
          SMOKE_OUTCOME: ${{ steps.production-smoke.outcome }}
        run: |
          required=false
          if [ "$PROMOTION_OUTCOME" != "success" ] || [ "$SWITCH_OUTCOME" != "success" ] || [ "$SMOKE_OUTCOME" != "success" ]; then
            required=true
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "Rollback required: $required"

      - name: Restore previous Production after failed promotion validation
        id: rollback
        if: always() && steps.preflight.outcome == 'success' && steps.promotion.outputs.attempted == 'true' && (steps.promotion.outcome != 'success' || steps.switch.outcome != 'success' || steps.production-smoke.outcome != 'success')
        continue-on-error: true
        env:
          PREVIOUS_PRODUCTION_ID: ${{ steps.previous.outputs.id }}
          PREVIOUS_PRODUCTION_URL: ${{ steps.previous.outputs.url }}
          PRODUCTION_URL: https://gold-market-observatory.vercel.app
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          critical=false

          if ! npx --yes vercel@59.1.4 promote "$PREVIOUS_PRODUCTION_URL" --yes --timeout=3m --token="$VERCEL_TOKEN"; then
            echo "::warning::Rollback promote command returned an error; verifying the formal domain conservatively."
          fi

          if ! node --input-type=module <<'NODE'
          const productionHost = "gold-market-observatory.vercel.app";
          async function getCurrentProduction() {
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${productionHost}`);
            if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!response.ok) throw new Error("Unable to resolve the formal Production domain after rollback");
            return response.json();
          }

          let current;
          for (let attempt = 1; attempt <= 6; attempt++) {
            current = await getCurrentProduction();
            if (current.id === process.env.PREVIOUS_PRODUCTION_ID) break;
            if (attempt < 6) await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (
            current?.id !== process.env.PREVIOUS_PRODUCTION_ID
            || current.projectId !== process.env.VERCEL_PROJECT_ID
            || current.target !== "production"
          ) {
            throw new Error("The formal Production domain was not restored to the previous deployment");
          }
          console.log("Previous Production deployment restored and verified.");
          NODE
          then
            critical=true
          fi

          smoke_route() {
            route="$1"
            response_file="$(mktemp)"
            if ! npx --yes vercel@59.1.4 curl "$route" \
              --deployment "$PRODUCTION_URL" \
              --silent --show-error --fail --location \
              --output "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            if ! grep -Eq "Gold Market Observatory|黄金市场观察站" "$response_file"; then
              rm -f "$response_file"
              return 1
            fi
            rm -f "$response_file"
          }

          if [ "$critical" = "false" ]; then
            if ! smoke_route / || ! smoke_route /design/refined-v4; then
              critical=true
            fi
          fi

          if [ "$critical" = "true" ]; then
            echo "::error::CRITICAL ROLLBACK FAILURE"
            echo "Previous Production ID: $PREVIOUS_PRODUCTION_ID"
            echo "Previous immutable URL: $PREVIOUS_PRODUCTION_URL"
            echo "status=critical-failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "Rollback validation and Production smoke tests passed."

      - name: Write scheduled Production summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          FETCH_STATUS: ${{ steps.fetch.outcome }}
          SERIES_COUNT: ${{ steps.dataset.outputs.series_count }}
          DERIVED_COUNT: ${{ steps.dataset.outputs.derived_count }}
          LATEST_DATE_MIN: ${{ steps.dataset.outputs.latest_date_min }}
          LATEST_DATE_MAX: ${{ steps.dataset.outputs.latest_date_max }}
          QUALITY_STATUS: ${{ steps.quality.outputs.status }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          BUILD_STATUS: ${{ steps.vercel-build.outcome }}
          TRACE_STATUS: ${{ steps.tracing.outputs.raw_status }}
          TRACE_OUTCOME: ${{ steps.tracing.outcome }}
          OUTPUT_STATUS: ${{ steps.output.outputs.output_status }}
          OUTPUT_OUTCOME: ${{ steps.output.outcome }}
          PREVIOUS_STATUS: ${{ steps.previous.outputs.status }}
          PREVIOUS_ID: ${{ steps.previous.outputs.id }}
          PREVIOUS_URL: ${{ steps.previous.outputs.url }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          STAGED_ID: ${{ steps.classification.outputs.staged_id }}
          CLASSIFICATION_STATUS: ${{ steps.classification.outputs.status }}
          DOMAIN_SAFETY_STATUS: ${{ steps.classification.outputs.domain_status }}
          STAGED_ROOT_SMOKE: ${{ steps.staged-smoke.outputs.root_status }}
          STAGED_REFINED_SMOKE: ${{ steps.staged-smoke.outputs.refined_status }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
          PROMOTION_ATTEMPTED: ${{ steps.promotion.outputs.attempted }}
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          SWITCH_STATUS: ${{ steps.switch.outputs.status }}
          PRODUCTION_ROOT_SMOKE: ${{ steps.production-smoke.outputs.root_status }}
          PRODUCTION_REFINED_SMOKE: ${{ steps.production-smoke.outputs.refined_status }}
          ROLLBACK_REQUIRED: ${{ steps.rollback-required.outputs.required }}
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.status }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger="Scheduled"
          else
            trigger="Manual"
          fi

          production_state="unchanged"
          final_id="${PREVIOUS_ID:-Not available}"
          final_url="https://gold-market-observatory.vercel.app"
          if [ "${PROMOTION_ATTEMPTED:-false}" = "true" ]; then
            if [ "$ROLLBACK_STATUS" = "success" ]; then
              production_state="restored"
              final_id="${PREVIOUS_ID:-Not available}"
            elif [ "$PROMOTION_OUTCOME" = "success" ] && [ "$SWITCH_STATUS" = "switched" ] && [ "$PRODUCTION_ROOT_SMOKE" = "success" ] && [ "$PRODUCTION_REFINED_SMOKE" = "success" ]; then
              production_state="updated"
              final_id="${STAGED_ID:-Not available}"
            else
              production_state="CRITICAL ROLLBACK FAILURE"
              final_id="Not safely determined"
            fi
          fi

          {
            echo "# Ephemeral Scheduled Production Update"
            echo
            echo "- Trigger: **${trigger}**"
            echo "- Data fetch: **${FETCH_STATUS:-Not run}**"
            echo "- Series count: **${SERIES_COUNT:-0}/17**"
            echo "- Derived count: **${DERIVED_COUNT:-0}/5**"
            echo "- Latest observation range: **${LATEST_DATE_MIN:-Not available} to ${LATEST_DATE_MAX:-Not available}**"
            echo "- Quality: **${QUALITY_STATUS:-${QUALITY_OUTCOME:-Not run}}**"
            echo "- Tests: **${TEST_STATUS:-Not run}**"
            echo "- Typecheck: **${TYPECHECK_STATUS:-Not run}**"
            echo "- Production build: **${BUILD_STATUS:-Not run}**"
            echo "- Next.js tracing: **${TRACE_STATUS:-${TRACE_OUTCOME:-Not run}}**"
            echo "- Vercel output verification: **${OUTPUT_STATUS:-${OUTPUT_OUTCOME:-Not run}}**"
            echo "- Previous Production recorded: **${PREVIOUS_STATUS:-Not run}**"
            echo "- Staged deploy: **${DEPLOY_STATUS:-Not run}**"
            echo "- Staged classification: **${CLASSIFICATION_STATUS:-Not run}**"
            echo "- Domain safety: **${DOMAIN_SAFETY_STATUS:-Not run}**"
            echo "- Staged smoke /: **${STAGED_ROOT_SMOKE:-Not run}**"
            echo "- Staged smoke /design/refined-v4: **${STAGED_REFINED_SMOKE:-Not run}**"
            echo "- Final pre-promotion safety check: **${PREFLIGHT_STATUS:-Not run}**"
            echo "- Promotion: **${PROMOTION_OUTCOME:-Not run}**"
            echo "- Formal domain validation: **${SWITCH_STATUS:-Not run}**"
            echo "- Production smoke /: **${PRODUCTION_ROOT_SMOKE:-Not run}**"
            echo "- Production smoke /design/refined-v4: **${PRODUCTION_REFINED_SMOKE:-Not run}**"
            echo "- Rollback required: **${ROLLBACK_REQUIRED:-false}**"
            echo "- Rollback status: **${ROLLBACK_STATUS:-Not required}**"
            echo "- Production state: **${production_state}**"
            echo "- Previous Production ID: ${PREVIOUS_ID:-Not available}"
            echo "- Previous immutable URL: ${PREVIOUS_URL:-Not available}"
            echo "- Staged Production ID: ${STAGED_ID:-Not available}"
            echo "- Staged immutable URL: ${STAGED_URL:-Not available}"
            echo "- Final Production ID: ${final_id}"
            echo "- Final Production URL: ${final_url}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce scheduled Production result
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PROMOTION_ATTEMPTED: ${{ steps.promotion.outputs.attempted }}
          PROMOTION_OUTCOME: ${{ steps.promotion.outcome }}
          SWITCH_OUTCOME: ${{ steps.switch.outcome }}
          SMOKE_OUTCOME: ${{ steps.production-smoke.outcome }}
          ROLLBACK_REQUIRED: ${{ steps.rollback-required.outputs.required }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
        run: |
          if [ "$PREFLIGHT_OUTCOME" != "success" ] || [ "${PROMOTION_ATTEMPTED:-false}" != "true" ]; then
            echo "::error::Scheduled Production validation failed before promotion; Production unchanged."
            exit 1
          fi
          if [ "$ROLLBACK_OUTCOME" = "success" ]; then
            echo "::error::Scheduled Production update failed and previous Production was restored."
            exit 1
          fi
          if [ "$PROMOTION_OUTCOME" != "success" ] || [ "$SWITCH_OUTCOME" != "success" ] || [ "$SMOKE_OUTCOME" != "success" ]; then
            echo "::error::CRITICAL ROLLBACK FAILURE"
            exit 1
          fi
          echo "Ephemeral Scheduled Production Update: SUCCESS"
