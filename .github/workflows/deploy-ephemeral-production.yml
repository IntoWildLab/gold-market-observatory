name: Ephemeral Staged Production Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ephemeral-staged-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-staged-production:
    name: Build and validate a staged Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify required repository secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in FRED_API_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: npm ci

      - name: Remove checked-in production snapshots
        run: |
          rm -rf data/series data/derived
          rm -f data/latest-spot.json data/latest-cn-etf.json data/manifest.json
          mkdir -p data/series data/derived

      - name: Verify empty production-data baseline
        run: |
          if find data/series data/derived -type f -print -quit | grep -q .; then
            echo "::error::Production series or derived snapshots remain before fetch."
            exit 1
          fi
          for file in data/latest-spot.json data/latest-cn-etf.json data/manifest.json; do
            if [ -e "$file" ]; then
              echo "::error::Production file remains before fetch: $file"
              exit 1
            fi
          done

      - name: Fetch all production data
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:fetch

      - name: Verify complete ephemeral dataset
        id: dataset
        run: node scripts/validate-ephemeral-build.mjs data

      - name: Run data quality gate
        id: quality
        run: npm run data:check

      - name: Remove raw and probe staging before build
        run: rm -rf data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out

      - name: Verify raw and probe staging is absent
        id: staging
        run: |
          for path in data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out; do
            if [ -e "$path" ]; then
              echo "::error::Staging path remains before build: $path"
              exit 1
            fi
          done
          echo "status=clean" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        run: npm test

      - name: Run typecheck
        id: typecheck
        run: npm run typecheck

      - name: Pull Vercel Production project settings
        id: vercel-pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production output
        id: vercel-build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 build --prod --token="$VERCEL_TOKEN"

      - name: Verify Next.js build tracing
        id: tracing
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs trace

      - name: Verify Vercel prebuilt output
        id: output
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs vercel-output

      - name: Record current Production deployment
        id: current-production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const productionHost = "gold-market-observatory.vercel.app";
          const endpoint = new URL(`https://api.vercel.com/v13/deployments/${productionHost}`);
          if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
          if (!response.ok) {
            console.error("::error::Unable to record the current Production deployment before staged deploy.");
            process.exit(1);
          }
          const deployment = await response.json();
          if (deployment.target !== "production" || deployment.projectId !== process.env.VERCEL_PROJECT_ID || !deployment.id) {
            console.error("::error::The current Production domain does not resolve to the configured Production project.");
            process.exit(1);
          }
          await import("node:fs/promises").then(({ appendFile }) =>
            appendFile(process.env.GITHUB_OUTPUT, `id=${deployment.id}\n`, "utf8")
          );
          console.log("Current Production deployment recorded for domain-safety verification.");
          NODE

      - name: Deploy staged Production without domain assignment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          staged_url="$(npx --yes vercel@59.1.4 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          case "$staged_url" in
            https://*.vercel.app) ;;
            *)
              echo "::error::Vercel CLI did not return a valid staged Production deployment URL."
              exit 1
              ;;
          esac
          if [ "$staged_url" = "https://gold-market-observatory.vercel.app" ]; then
            echo "::error::Staged deployment resolved to the formal Production domain; refusing to continue."
            exit 1
          fi
          echo "url=$staged_url" >> "$GITHUB_OUTPUT"
          echo "Staged Production deployment created without domain assignment."

      - name: Verify staged classification and domain safety
        id: classification
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS_PRODUCTION_ID: ${{ steps.current-production.outputs.id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const productionHost = "gold-market-observatory.vercel.app";
          async function getDeployment(host) {
            const endpoint = new URL(`https://api.vercel.com/v13/deployments/${host}`);
            if (process.env.VERCEL_ORG_ID.startsWith("team_")) endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
            const response = await fetch(endpoint, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!response.ok) throw new Error(`Unable to inspect deployment metadata for ${host}`);
            return response.json();
          }

          try {
            const stagedHost = new URL(process.env.STAGED_URL).hostname;
            const staged = await getDeployment(stagedHost);
            const currentProduction = await getDeployment(productionHost);
            const stagedAliases = Array.isArray(staged.alias) ? staged.alias : [];
            const stagedAutomaticAliases = Array.isArray(staged.automaticAliases) ? staged.automaticAliases : [];

            if (staged.target !== "production" || staged.projectId !== process.env.VERCEL_PROJECT_ID) {
              throw new Error("The staged deployment is not classified as Production for the configured project");
            }
            if (!staged.id || staged.id === process.env.PREVIOUS_PRODUCTION_ID) {
              throw new Error("The staged deployment is not a distinct new Production deployment");
            }
            if (stagedAliases.includes(productionHost) || stagedAutomaticAliases.includes(productionHost)) {
              throw new Error("The staged deployment has received the formal Production domain");
            }
            if (currentProduction.id !== process.env.PREVIOUS_PRODUCTION_ID) {
              throw new Error("The formal Production domain changed during the staged deployment");
            }

            await import("node:fs/promises").then(({ appendFile }) =>
              appendFile(process.env.GITHUB_OUTPUT, "status=production-staged\ndomain_status=unchanged\n", "utf8")
            );
            console.log("Staged deployment classification verified; formal Production domain remains unchanged.");
          } catch (error) {
            console.error(`::error::${error instanceof Error ? error.message : String(error)}`);
            process.exit(1);
          }
          NODE

      - name: Smoke test staged Production routes
        id: smoke
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for route in / /design/refined-v4; do
            response_file="$(mktemp)"
            npx --yes vercel@59.1.4 curl "$route" \
              --deployment "$STAGED_URL" \
              --silent --show-error --fail --location \
              --output "$response_file"
            if ! grep -Eq "Gold Market Observatory|黄金市场观察站" "$response_file"; then
              echo "::error::Staged Production route ${route} did not contain the stable project title."
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
            echo "Staged Production smoke test passed: ${route}"
          done

      - name: Write staged Production validation summary
        if: always()
        env:
          FETCH_STATUS: ${{ steps.fetch.outcome }}
          SERIES_COUNT: ${{ steps.dataset.outputs.series_count }}
          DERIVED_COUNT: ${{ steps.dataset.outputs.derived_count }}
          QUALITY_STATUS: ${{ steps.quality.outputs.status }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          VERCEL_BUILD_STATUS: ${{ steps.vercel-build.outcome }}
          TRACE_STATUS: ${{ steps.tracing.outputs.raw_status }}
          OUTPUT_STATUS: ${{ steps.output.outputs.output_status }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          CLASSIFICATION_STATUS: ${{ steps.classification.outputs.status }}
          DOMAIN_SAFETY_STATUS: ${{ steps.classification.outputs.domain_status }}
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "# Ephemeral Staged Production Validation"
            echo
            echo "- Data fetch: **${FETCH_STATUS:-Not run}**"
            echo "- Series count: **${SERIES_COUNT:-Not available}**"
            echo "- Derived count: **${DERIVED_COUNT:-Not available}**"
            echo "- Quality: **${QUALITY_STATUS:-${QUALITY_OUTCOME:-Not run}}**"
            echo "- Tests: **${TEST_STATUS:-Not run}**"
            echo "- Typecheck: **${TYPECHECK_STATUS:-Not run}**"
            echo "- Vercel Production build: **${VERCEL_BUILD_STATUS:-Not run}**"
            echo "- Next.js output tracing: **${TRACE_STATUS:-Not run}**"
            echo "- Vercel output verification: **${OUTPUT_STATUS:-Not run}**"
            echo "- Staged Production deploy: **${DEPLOY_STATUS:-Not run}**"
            echo "- Deployment classification: **${CLASSIFICATION_STATUS:-Not run}**"
            echo "- Domain assignment safety check: **${DOMAIN_SAFETY_STATUS:-Not run}**"
            echo "- Staged smoke test: **${SMOKE_STATUS:-Not run}**"
            if [ -n "$STAGED_URL" ]; then
              echo "- Staged URL: ${STAGED_URL}"
            fi
            echo "- Promotion: **NOT PERFORMED**"
          } >> "$GITHUB_STEP_SUMMARY"
