name: Ephemeral Staged Production Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ephemeral-staged-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-staged-production:
    name: Build and validate a staged Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify required repository secrets
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in FRED_API_KEY VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install locked dependencies
        run: npm ci

      - name: Remove checked-in production snapshots
        run: |
          rm -rf data/series data/derived data/events
          rm -f data/latest-spot.json data/latest-cn-etf.json data/manifest.json
          mkdir -p data/series data/derived

      - name: Verify empty production-data baseline
        run: |
          if find data/series data/derived -type f -print -quit | grep -q .; then
            echo "::error::Production series or derived snapshots remain before fetch."
            exit 1
          fi
          for file in data/latest-spot.json data/latest-cn-etf.json data/manifest.json; do
            if [ -e "$file" ]; then
              echo "::error::Production file remains before fetch: $file"
              exit 1
            fi
          done
          if [ -e data/events ]; then
            echo "::error::Event Risk snapshot directory remains before fetch."
            exit 1
          fi

      - name: Fetch all production data
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run data:fetch

      - name: Verify complete ephemeral dataset
        id: dataset
        run: node scripts/validate-ephemeral-build.mjs data

      - name: Run data quality gate
        id: quality
        run: npm run data:check

      - name: Fetch auxiliary Event Risk snapshot
        id: event-risk-fetch
        run: |
          set +e
          npm run data:fetch:events
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::warning::Event Risk auxiliary fetch failed; continuing with Daily Core."
          fi
          exit 0

      - name: Write Event Risk diagnostic summary
        id: event-risk-summary
        if: always()
        run: node scripts/report-event-risk.mjs

      - name: Remove raw and probe staging before build
        run: rm -rf data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out

      - name: Verify raw and probe staging is absent
        id: staging
        run: |
          for path in data/raw scripts/probe-out scripts/probe-out2 scripts/probes/probe-out; do
            if [ -e "$path" ]; then
              echo "::error::Staging path remains before build: $path"
              exit 1
            fi
          done
          echo "status=clean" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        run: npm test

      - name: Run typecheck
        id: typecheck
        run: npm run typecheck

      - name: Pull Vercel Production project settings
        id: vercel-pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel Production output
        id: vercel-build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.1.4 build --prod --token="$VERCEL_TOKEN"

      - name: Verify Next.js build tracing
        id: tracing
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs trace

      - name: Verify Vercel prebuilt output
        id: output
        env:
          EPHEMERAL_SECRET_TO_REJECT: ${{ secrets.FRED_API_KEY }}
        run: node scripts/validate-ephemeral-build.mjs vercel-output

      - name: Snapshot current Production aliases
        id: production-snapshot
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/production-alias-safety.mjs capture "$RUNNER_TEMP/production-alias-snapshot.json"

      - name: Deploy staged Production without domain assignment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          staged_url="$(npx --yes vercel@59.1.4 deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          case "$staged_url" in
            https://*.vercel.app) ;;
            *)
              echo "::error::Vercel CLI did not return a valid staged Production deployment URL."
              exit 1
              ;;
          esac
          if [ "$staged_url" = "https://gold-market-observatory.vercel.app" ]; then
            echo "::error::Staged deployment resolved to the formal Production domain; refusing to continue."
            exit 1
          fi
          echo "url=$staged_url" >> "$GITHUB_OUTPUT"
          echo "Staged Production deployment created without domain assignment."

      - name: Verify staged classification and Production alias invariant
        id: alias-safety
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/production-alias-safety.mjs enforce "$RUNNER_TEMP/production-alias-snapshot.json" "$STAGED_URL"

      - name: Smoke test staged Production routes
        id: smoke
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for route in / /design/refined-v4 /design/refined-v5; do
            response_file="$(mktemp)"
            npx --yes vercel@59.1.4 curl "$route" \
              --deployment "$STAGED_URL" \
              --silent --show-error --fail --location \
              --output "$response_file"
            if ! grep -Eq "Gold Market Observatory|黄金市场观察站" "$response_file"; then
              echo "::error::Staged Production route ${route} did not contain the stable project title."
              rm -f "$response_file"
              exit 1
            fi
            if [ "$route" = "/" ] && ! grep -q 'data-v5-page="refined-v5"' "$response_file"; then
              echo "::error::Staged Production root did not contain the refined-v5 production marker."
              rm -f "$response_file"
              exit 1
            fi
            rm -f "$response_file"
            echo "Staged Production smoke test passed: ${route}"
          done

      - name: Verify staged Event Risk render
        id: event-risk-render
        env:
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          npx --yes vercel@59.1.4 curl /design/refined-v5 \
            --deployment "$STAGED_URL" \
            --silent --show-error --fail --location \
            --output "$response_file"
          node scripts/check-event-risk-render.mjs data/events/event-risk.json "$response_file"

      - name: Write staged Production validation summary
        if: always()
        env:
          FETCH_STATUS: ${{ steps.fetch.outcome }}
          EVENT_RISK_FETCH_STATUS: ${{ steps.event-risk-fetch.outputs.status }}
          EVENT_RISK_FETCH_EXIT_CODE: ${{ steps.event-risk-fetch.outputs.exit_code }}
          EVENT_RISK_SNAPSHOT: ${{ steps.event-risk-summary.outputs.snapshot }}
          EVENT_RISK_AVAILABILITY: ${{ steps.event-risk-summary.outputs.availability }}
          EVENT_RISK_BLS_STATUS: ${{ steps.event-risk-summary.outputs.bls_status }}
          EVENT_RISK_BLS_MODE: ${{ steps.event-risk-summary.outputs.bls_mode }}
          EVENT_RISK_EVENT_COUNT: ${{ steps.event-risk-summary.outputs.event_count }}
          EVENT_RISK_RENDER_STATUS: ${{ steps.event-risk-render.outputs.status }}
          EVENT_RISK_RENDER_EXPECTATION: ${{ steps.event-risk-render.outputs.expected_kind }}
          CORE_SERIES_COUNT: ${{ steps.dataset.outputs.core_series_count }}
          CORE_SERIES_EXPECTED: ${{ steps.dataset.outputs.core_series_expected }}
          AUX_SERIES_COUNT: ${{ steps.dataset.outputs.aux_series_count }}
          AUX_SERIES_EXPECTED: ${{ steps.dataset.outputs.aux_series_expected }}
          CORE_DERIVED_COUNT: ${{ steps.dataset.outputs.core_derived_count }}
          CORE_DERIVED_EXPECTED: ${{ steps.dataset.outputs.core_derived_expected }}
          AUX_DERIVED_COUNT: ${{ steps.dataset.outputs.aux_derived_count }}
          AUX_DERIVED_EXPECTED: ${{ steps.dataset.outputs.aux_derived_expected }}
          DATASET_STATUS: ${{ steps.dataset.outputs.dataset_status }}
          QUARTERLY_SHARES_STATUS: ${{ steps.dataset.outputs.quarterly_shares_status }}
          DAILY_SHARES_STATUS: ${{ steps.dataset.outputs.daily_shares_status }}
          FOUNDATION_STATUS: ${{ steps.dataset.outputs.foundation_status }}
          QUALITY_STATUS: ${{ steps.quality.outputs.status }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          TYPECHECK_STATUS: ${{ steps.typecheck.outcome }}
          VERCEL_BUILD_STATUS: ${{ steps.vercel-build.outcome }}
          TRACE_STATUS: ${{ steps.tracing.outputs.raw_status }}
          OUTPUT_STATUS: ${{ steps.output.outputs.output_status }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          CURRENT_PRODUCTION_ID: ${{ steps.production-snapshot.outputs.current_id }}
          PRODUCTION_ALIAS_COUNT: ${{ steps.production-snapshot.outputs.alias_count }}
          CLASSIFICATION_STATUS: ${{ steps.alias-safety.outputs.status }}
          ALIAS_SAFETY_STATUS: ${{ steps.alias-safety.outputs.alias_status }}
          ALIAS_RESTORATION_STATUS: ${{ steps.alias-safety.outputs.restoration }}
          STAGED_DEPLOYMENT_ID: ${{ steps.alias-safety.outputs.staged_id }}
          STAGED_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "# Ephemeral Staged Production Validation"
            echo
            echo "- Data fetch: **${FETCH_STATUS:-Not run}**"
            echo "- Event Risk fetch: **${EVENT_RISK_FETCH_STATUS:-Not run}** (exit ${EVENT_RISK_FETCH_EXIT_CODE:-not available})"
            echo "- Event Risk snapshot: **${EVENT_RISK_SNAPSHOT:-not available}**"
            echo "- Event Risk availability: **${EVENT_RISK_AVAILABILITY:-unavailable}**"
            echo "- Event Risk BLS: **${EVENT_RISK_BLS_STATUS:-not available}** / **${EVENT_RISK_BLS_MODE:-not available}**"
            echo "- Event Risk event count: **${EVENT_RISK_EVENT_COUNT:-0}**"
            echo "- Event Risk staged render: **${EVENT_RISK_RENDER_STATUS:-Not run}** (${EVENT_RISK_RENDER_EXPECTATION:-not available})"
            echo
            echo "## Daily Core"
            echo "- Core series: **${CORE_SERIES_COUNT:-0}/${CORE_SERIES_EXPECTED:-15}**"
            echo "- Core derived: **${CORE_DERIVED_COUNT:-0}/${CORE_DERIVED_EXPECTED:-4}**"
            echo "- Core status: **${{ steps.dataset.outcome == 'success' && 'PASS' || 'FAIL' }}**"
            echo
            echo "## Auxiliary Capabilities"
            echo "- 518880 quarterly shares: **${QUARTERLY_SHARES_STATUS:-unavailable}**"
            echo "- 518880 daily shares: **${DAILY_SHARES_STATUS:-unavailable}**"
            echo "- CN ETF foundation: **${FOUNDATION_STATUS:-unavailable}**"
            echo "- Event Risk: **${EVENT_RISK_AVAILABILITY:-unavailable}**"
            echo "- Dataset status: **${DATASET_STATUS:-Not run}**"
            echo "- Quality: **${QUALITY_STATUS:-${QUALITY_OUTCOME:-Not run}}**"
            echo "- Tests: **${TEST_STATUS:-Not run}**"
            echo "- Typecheck: **${TYPECHECK_STATUS:-Not run}**"
            echo "- Vercel Production build: **${VERCEL_BUILD_STATUS:-Not run}**"
            echo "- Next.js output tracing: **${TRACE_STATUS:-Not run}**"
            echo "- Vercel output verification: **${OUTPUT_STATUS:-Not run}**"
            echo "- Staged Production deploy: **${DEPLOY_STATUS:-Not run}**"
            echo "- Deployment classification: **${CLASSIFICATION_STATUS:-Not run}**"
            echo "- Captured Production deployment: **${CURRENT_PRODUCTION_ID:-Not run}**"
            echo "- Captured Production aliases: **${PRODUCTION_ALIAS_COUNT:-0}**"
            echo "- Production alias invariant: **${ALIAS_SAFETY_STATUS:-Not run}**"
            echo "- Automatic alias restoration: **${ALIAS_RESTORATION_STATUS:-Not run}**"
            echo "- Staged deployment ID: **${STAGED_DEPLOYMENT_ID:-Not run}**"
            echo "- Staged smoke test: **${SMOKE_STATUS:-Not run}**"
            if [ -n "$STAGED_URL" ]; then
              echo "- Staged URL: ${STAGED_URL}"
            fi
            echo "- Promotion: **NOT PERFORMED**"
          } >> "$GITHUB_STEP_SUMMARY"
